name: Comment on PR for CI Failure
permissions:
  pull-requests: write

on:
  workflow_run:
    workflows: [Monkey CI]
    types: [completed]

jobs:
  on-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Download workflow artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read the pr_num file
        id: pr_num_reader
        uses: juliangruber/read-file-action@v1
        with:
          path: ./pr_num/pr_num.txt

      - name: Create comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ steps.pr_num_reader.outputs.content }}
          body: |
            Continuous integration check(s) failed. Please review the [failing check\'s logs](${{ github.event.workflow_run.html_url }}) and make the necessary changes.
            - Important: Do not close this PR and open a new one. Push your fixes to the same branch; the existing PR will update and CI will re-run automatically.
            - To re-run without new commits (e.g., transient failures), open the Checks tab on this PR and use “Re-run jobs”/“Re-run all jobs”.
            - Keeping the same PR preserves review history, labels, and automation, and avoids extra notifications for maintainers.

      - name: Apply label changes
        uses: PauMAVA/add-remove-label-action@v1.0.3
        with:
          issue_number:  ${{ steps.pr_num_reader.outputs.content }}
          add: "waiting for update"
          remove: "waiting for review"
